<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="assets/js/sedb.js"></script>



<script>

var markers = L.markerClusterGroup();

var mymap = L.map('mapid').setView([35.859251, 139.983061], 12);

jQuery(document).ready(function() {

	L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	}).addTo(mymap);

	SEDB.load().then(search);

});



function search(data) {
	// 座標は tools/build_json.py が地名から引いて JSON に入れてある
	$.each(SEDB.rows(data), function(i, row) {
		var c = row.c;
		if (c.lat === undefined) {
			return;
		}
		addMarker({
			lat : c.lat,
			lon : c.lon,
			title : c.title,
			exTitle : row.exp.title,
			uri : c.uri
		});
	});

	mymap.addLayer(markers);
}

function addMarker(data) {
	var marker = L.marker(new L.LatLng(data.lat, data.lon), { title: data.exTitle });

	var div = $("<div>");
	div.attr("style", "width : 300px");

	var media = $("<div>");
	div.append(media);
	media.attr("class", "media");

	var left = $("<div>");
	media.append(left);
	left.attr("class", "pull-left");

	var a = $("<a>");
	left.append(a);
	a.attr("href", "detail.html?uri=" + data.uri);

	var img = $("<img>");
	a.append(img);

	img.attr("class", "media-object");
	img.attr("src", "assets/images/apple-touch-icon.png");
	img.attr("style", "width : 64px; height : 64px");

	var body = $("<div>");
	media.append(body);
	body.attr("class", "media-body");

	var h4 = $("<h4>");
	body.append(h4);
	h4.attr("class", "media-heading");
	h4.text(data.title);

	var a = $("<a>");
	body.append(a);
	a.attr("href", "detail.html?uri=" + data.uri);
	a.append("詳細");

	var contentStr = $("<div>").append(div.clone()).html();

	marker.bindPopup(contentStr);
	markers.addLayer(marker);
}

function move(data) {
	location.href = data;
}
</script>
