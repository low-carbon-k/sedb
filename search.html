<!-- Latest compiled and minified JavaScript -->
<script src="assets/thirdparty/bootstrap-3.3.7/js/bootstrap.min.js"></script>
<script type="text/javascript" src="//cdn.datatables.net/1.10.15/js/jquery.dataTables.min.js"></script>

<script type="text/javascript" src="assets/js/sedb.js"></script>

<script type="text/javascript">
var lang = "en";

var DATA;

jQuery(document).ready(function() {

	SEDB.load().then(function(data) {
		DATA = data;

		getSelect();

		search({});
	});

	//検索画面の表示切替
	$("#jQueryPush").click(function() {
		$("#search").toggle();
	});

});

function getSelect() {

	var selectArray = new Object();
	selectArray.group = new Array();
	selectArray.exp = new Array();
	selectArray.process = new Array();
	selectArray["type"] = new Array();
	selectArray.condition = new Array();

	$.each(DATA.cases, function(i, c) {
		$.each(["group", "process", "type", "condition"], function(j, key) {
			if (c[key] != "" && selectArray[key].indexOf(c[key]) == -1) {
				selectArray[key].push(c[key]);
			}
		});
	});
	$.each(DATA.experiments, function(i, e) {
		selectArray.exp.push(e.exTitle);
	});

	$.each(selectArray, function(key, array) {

		array.sort();

		var select = $("<select>");
		$("#" + key).append(select);
		select.attr("class", "form-control");
		select.attr("name", key);

		var option = $("<option>");
		select.append(option);
		option.attr("value", "");
		option.append("-");

		for (var i = 0; i < array.length; i++) {
			$("<option>").attr("value", array[i]).text(array[i]).appendTo(select);
		}
	});

}

// 全文検索の対象にする事例の項目
var textFields = ["title", "group", "process", "type", "problem", "problemSystem",
	"problemInterest", "problemDiffusion", "problemTech", "influence",
	"solution", "service", "improvement", "condition", "suggestion",
	"place", "keyword", "location"];

function match(row, cond) {
	var c = row.c;

	if (cond.text) {
		var fields = cond.textTarget == "keyword" ? ["keyword"] : textFields;
		var q = cond.text.toLowerCase();
		var hit = false;
		for (var i = 0; i < fields.length; i++) {
			if (c[fields[i]].toLowerCase().indexOf(q) != -1) {
				hit = true;
				break;
			}
		}
		if (!hit) {
			return false;
		}
	}

	if (cond.exp && row.exp.title != cond.exp) {
		return false;
	}

	var keys = ["group", "process", "type", "condition"];
	for (var i = 0; i < keys.length; i++) {
		if (cond[keys[i]] && c[keys[i]] != cond[keys[i]]) {
			return false;
		}
	}

	return true;
}

function search(cond) {
	var tbody = $("#listBody");
	tbody.empty();

	$.each(SEDB.rows(DATA), function(i, row) {
		if (!match(row, cond)) {
			return;
		}
		var obj = row.c;

		var tr = $("<tr>");
		tbody.append(tr);

		$("<td>").text(obj.title).appendTo(tr);

		var td = $("<td>");
		tr.append(td);
		$("<a>").attr("href", "index.html?group=" + obj.group).text(obj.group).appendTo(td);

		td = $("<td>");
		tr.append(td);
		$("<a>").attr("href", "group.html?uri=" + row.exp.uri).text(row.exp.title).appendTo(td);

		$("<td>").text(obj.process).appendTo(tr);
		$("<td>").text(obj.type).appendTo(tr);
		$("<td>").text(obj.keyword).appendTo(tr);

		td = $("<td>");
		tr.append(td);

		var a = $("<a>");
		td.append(a);
		a.attr("href", "detail.html?uri=" + obj.uri);
		a.attr("class", "btn green");
		a.append("詳細 &raquo;");
	});

	$('#table').DataTable({
		"iDisplayLength" : 50,
		"order" : [ [ 1, "desc" ] ]
	});
}

jQuery(function($) {
	$('#the-form').submit(
		function(event) {
			// HTMLでの送信をキャンセル
			event.preventDefault();

			var cond = new Object();
			$.each($(this).serializeArray(), function(i, param) {
				if (param.name == "query") {
					cond.text = $.trim(param.value);
				} else {
					cond[param.name] = param.value;
				}
			});

			$('#table').dataTable().fnDestroy();

			search(cond);

		});
	});

	//「ページトップへ」をクリックした場合
	$('#pagetop').click(function() {
		// ページトップにスクロール
		$('html,body').animate({
			scrollTop : 0
		}, 1000);
		return false;
	});

	function move(data) {
		location.href = data;
	}
</script>
