{% extends "base.html" %}
{% block main %}
<div class="container py-3">
  <h1 class="h3 mb-3">社会実験事例データ検索</h1>
  <form id="search-form" class="search-form p-3 mb-3">
    <div class="row g-2 align-items-center mb-2">
      <div class="col-md-2"><label class="col-form-label" for="q">検索キーワード</label></div>
      <div class="col-md-6"><input type="search" class="form-control" id="q" name="q"></div>
      <div class="col-md-4">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="target" id="target-all" value="all" checked>
          <label class="form-check-label" for="target-all">全文</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="target" id="target-keyword" value="keyword">
          <label class="form-check-label" for="target-keyword">キーワードのみ</label>
        </div>
      </div>
    </div>
    <div class="row g-2 align-items-center">
      {%- for key, label in FILTERS %}
      <div class="col-md-2"><label class="col-form-label" for="f-{{ key }}">{{ label }}</label></div>
      <div class="col-md-2">
        <select class="form-select" id="f-{{ key }}" name="{{ key }}">
          <option value="">-</option>
          {%- for v in filter_values[key] %}
          <option value="{{ v }}">{{ v }}</option>
          {%- endfor %}
        </select>
      </div>
      {%- endfor %}
      <div class="col-md-4 d-flex gap-2">
        <button type="submit" class="btn btn-home">{{ icon('search') }} 検索</button>
        <button type="reset" class="btn btn-outline-secondary">クリア</button>
      </div>
    </div>
  </form>
  <p id="count" class="mb-2" aria-live="polite"></p>
  <div class="table-responsive">
  <table class="table table-bordered table-striped table-hover list" id="table">
    <thead>
      <tr class="green">
        <th><button type="button" class="sort" data-key="title">タイトル</button></th>
        <th><button type="button" class="sort" data-key="group">グループ名</button></th>
        <th><button type="button" class="sort" data-key="exp">社会実験名</button></th>
        <th><button type="button" class="sort" data-key="process">フェーズ</button></th>
        <th><button type="button" class="sort" data-key="type">課題の種類</button></th>
        <th><button type="button" class="sort" data-key="keyword">キーワード</button></th>
        <th>詳細</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  </div>
  <a href="#" class="pagetop btn btn-home is-hidden" aria-label="ページの先頭へ">{{ icon('arrow-up') }} TOP</a>
</div>
{% endblock %}
{% block scripts %}
<script src="assets/js/sedb.js"></script>
<script src="assets/js/search.js"></script>
{% endblock %}
