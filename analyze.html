<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="text/javascript">
jQuery(document).ready(function() {
	SEDB.load().then(search);

	var select = $("#select");
	$.each(labels, function(k, v) {
		var option = $("<option>");
		select.append(option);
		option.attr("value", k);
		option.append(v);
	});
});

var fields = new Object();
fields.process = new Array();
fields.condition = new Array();
fields["type"] = new Array();

var labels = new Object();
labels.process = "フェーズ";
labels.condition = "対応状況";
labels["type"] = "課題の種別";

var json = new Object();

// 元の index.html のグループの色
var colors = ["#C2CA2D", "#E39E52", "#E2536B", "#C04F88", "#1F7FB1", "#939494",
	"#99A021", "#B88043", "#B84357", "#9C406E", "#19668F"];

var chart = null;

// 事例 1 件を 1 と数える（複数の社会実験に属する事例も 1 回だけ）
function search(data) {

	$.each(data.cases, function(i, obj) {

		var group = obj.group;
		if (!json[group]) {
			json[group] = new Object();
			$.each(fields, function(k, v) {
				json[group][k] = new Object();
			});

		}

		var gJson = json[group];

		$.each(fields, function(k, v) {
			var target = obj[k];
			if (target != "") {
				if (!gJson[k][target]) {
					gJson[k][target] = 1;
				} else {
					gJson[k][target] += 1;
				}

				if (fields[k].indexOf(target) == -1) {
					fields[k].push(target);
				}
			}

		});

	});

	$.each(fields, function(k, v) {
		v.sort();
	});

	show("process");
}

function show(data) {

	var targetArray = fields[data];
	var groups = Object.keys(json).sort();

	var datasets = new Array();
	for (var i = 0; i < targetArray.length; i++) {
		var values = new Array();
		for (var j = 0; j < groups.length; j++) {
			values.push(json[groups[j]][data][targetArray[i]] || 0);
		}
		datasets.push({
			label : targetArray[i],
			data : values,
			backgroundColor : colors[i % colors.length]
		});
	}

	if (chart) {
		chart.destroy();
	}

	chart = new Chart(document.getElementById('chart_div'), {
		type : "bar",
		data : {
			labels : groups,
			datasets : datasets
		},
		options : {
			maintainAspectRatio : false,
			plugins : {
				title : {
					display : true,
					text : "『" + labels[data] + "』に関する分析"
				}
			},
			scales : {
				x : { title : { display : true, text : "グループ" } },
				y : { beginAtZero : true, ticks : { precision : 0 }, title : { display : true, text : "事例数" } }
			}
		}
	});

}

function redraw() {
	show($("#select").val());
}

function move(data) {
	location.href = data;
}
</script>
