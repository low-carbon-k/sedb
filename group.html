<script type="text/javascript">
jQuery(document).ready(function() {
	SEDB.load().then(function(data) {
		detail(data);
		search(data);
	});
});

var uri = SEDB.param("uri");

function detail(data) {

	var exp = data.expByUri[uri];
	if (!exp) {
		return;
	}

	$.each(["exTitle", "purpose", "sequence", "summary", "organization", "finance"], function(i, v) {
		$("#" + v).append(SEDB.html(exp[v]));
	});

	$("#title").text(exp.exTitle);
	$("#title2").text(exp.exTitle);
}

function search(data) {
	var tbody = $("#listBody");

	var flag = true;

	$.each(SEDB.rows(data), function(i, row) {
		if (row.exp.uri != uri) {
			return;
		}
		var obj = row.c;

		var tr = $("<tr>");
		tbody.append(tr);

		$.each(["title", "process", "type", "keyword"], function(j, v) {
			$("<td>").text(obj[v]).appendTo(tr);
		});

		var td = $("<td>");
		tr.append(td);

		var a = $("<a>");
		td.append(a);
		a.attr("href", "detail.html?uri=" + obj.uri);
		a.attr("class", "btn dense");
		a.append("詳細 &raquo;");

		if (flag) {
			var group = obj.group;
			var div = $("#gp");
			div
			.attr("onclick", "move('index.html?group=" + group
			+ "')");
			var group2 = group.replace("G", "グループ");
			div.append(group2);
			flag = false;
		}
	});

	$('#table').DataTable({
		"iDisplayLength" : 50,
		"order" : [ [ 1, "desc" ] ]
	});
}

function move(data) {
	location.href = data;
}
</script>
